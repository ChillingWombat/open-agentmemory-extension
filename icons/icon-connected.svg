<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="card-shadow" x="-12%" y="-12%" width="124%" height="128%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3c4043" flood-opacity="0.15" />
    </filter>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="35%" stop-color="#9B72CB" />
      <stop offset="70%" stop-color="#D96570" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>
  </defs>

  <!-- Google-style Card Canvas -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#FFFFFF" filter="url(#card-shadow)" />
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#E8EAED" stroke-width="1.5" />

  <!-- Four Intersecting Memory Arcs / Google Colors -->
  <!-- Top Arc (Blue) - Neural Memory Input -->
  <path d="M 42 36 C 54 26, 74 26, 86 36 C 92 41, 88 50, 80 50 C 74 50, 68 44, 64 42 C 60 44, 54 50, 48 50 C 40 50, 36 41, 42 36 Z" fill="#4285F4" />

  <!-- Left Brain Hemisphere / Loop (Green) -->
  <path d="M 34 50 C 24 58, 24 74, 34 84 C 42 92, 52 86, 52 78 C 52 72, 46 66, 44 62 C 46 58, 50 54, 48 50 C 46 46, 38 46, 34 50 Z" fill="#34A853" />

  <!-- Right Brain Hemisphere / Loop (Red) -->
  <path d="M 94 50 C 104 58, 104 74, 94 84 C 86 92, 76 86, 76 78 C 76 72, 82 66, 84 62 C 82 58, 78 54, 80 50 C 82 46, 90 46, 94 50 Z" fill="#EA4335" />

  <!-- Bottom Loop / Archive Storage (Yellow) -->
  <path d="M 48 84 C 54 94, 74 94, 80 84 C 86 76, 78 72, 72 74 C 68 76, 64 78, 64 78 C 64 78, 60 76, 56 74 C 50 72, 42 76, 48 84 Z" fill="#FBBC04" />

  <!-- Center AI Sparkle Star (Google Gemini / WebAI Core) -->
  <path d="M 64 36 C 64 50, 78 64, 92 64 C 78 64, 64 78, 64 92 C 64 78, 50 64, 36 64 C 50 64, 64 50, 64 36 Z" fill="url(#geminiGrad)" />

  <!-- Synaptic Memory Nodes -->
  <circle cx="64" cy="64" r="6.5" fill="#FFFFFF" stroke="#4285F4" stroke-width="2.5" />
  <circle cx="42" cy="42" r="4" fill="#4285F4" />
  <circle cx="86" cy="42" r="4" fill="#EA4335" />
  <circle cx="34" cy="70" r="4" fill="#34A853" />
  <circle cx="94" cy="70" r="4" fill="#EA4335" />
  <circle cx="64" cy="86" r="4" fill="#FBBC04" />

  <!-- Miniature Green Connected Tick in Corner -->
  <circle cx="102" cy="102" r="15" fill="#16a34a" stroke="#FFFFFF" stroke-width="3" />
  <path d="M 96 102 L 100 106 L 108 97" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
